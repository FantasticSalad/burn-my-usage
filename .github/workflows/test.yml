name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the system bash 3.2, the oldest the scripts support. Windows runs Git Bash.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: use the system bash 3.2 on macOS, not Homebrew's
        if: runner.os == 'macOS'
        run: echo /bin >> "$GITHUB_PATH"
      - name: bash version
        shell: bash
        run: bash --version | head -n 1
      - name: tests
        shell: bash
        run: bash tests/run-all.sh
      # Windows profile folders often have a space and an apostrophe, and Git Bash then stops
      # converting paths for git and Node. Run the suite again from such a folder. Windows only:
      # the conversion problem doesn't exist elsewhere, and a second macOS run is costly.
      - name: tests from a path with a space and an apostrophe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          odd="$RUNNER_TEMP/o'brien dir"
          mkdir -p "$odd"
          cp -R . "$odd/bmu"
          cd "$odd/bmu"
          bash tests/run-all.sh
      - name: trace guard cases after a failure
        if: failure()
        shell: bash
        run: bash tests/trace-cases.sh
